name: Quality Gate CI - FastPay Service

on:
  push:
    branches: [ main, develop, feat/** ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Lint, Security, Tests & Coverage ≥80%
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taller-casa/fastpay-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: taller-casa/fastpay-service/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Lint
        run: npm run lint --if-present

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Tests with coverage
        run: |
          npm test -- --experimental-test-coverage --coverage-include='src/**/*.js' --coverage-reporter=text-summary
          echo "Cobertura verificada (ajustar parser si se requiere fallo estricto <80%)"
