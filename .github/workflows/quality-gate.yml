name: Quality Gate CI

on:
  push:
    branches: [ main, develop, feat/** ]
  pull_request:
    branches: [ main ]

jobs:
  quality-gate:
    name: Lint, Audit & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: taller-casa/fastpay-service
        run: npm install

      - name: Lint
        working-directory: taller-casa/fastpay-service
        run: npm run lint --if-present || true

      - name: Security audit
        working-directory: taller-casa/fastpay-service
        run: npm audit --audit-level=high || true

      - name: Run tests
        working-directory: taller-casa/fastpay-service
        run: npm test

      - name: Quality Gate summary
        run: echo "Quality Gate completed"
